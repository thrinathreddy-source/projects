name: Resource scrape

# Every 6 hours, not hourly — new resources don't go stale like job
# deadlines do, and this is gentler on GitHub's/Reddit's unauthenticated
# rate limits. See app/api/cron/scrape-resources/route.ts.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger resource scrape pass
        run: |
          curl -sf -X GET "https://www.oppidx.com/api/cron/scrape-resources" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
